server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    # SPA 直接访问 /users 这类子路由时也要回落到 index.html，交给前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：每次回源校验，避免发版后浏览器拿着旧 HTML 引用已删除的旧 JS（白屏/空数据）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # vite 产物带内容 hash，可安全长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # workbench web（antd-mobile 壳）静态托管：compose 把 /opt/stack/data/workbench
    # 只读挂到 html/workbench，网关兜底路由把 /workbench/** 送进来——页面与 /api
    # 同源同端口，天然零跨域（页面里 DEFAULT_BASE_URL 指向的就是本域）。
    # 深层路由不存在（该应用无前端路由，Tab 靠状态切换），无需 SPA 回落。
    location = /workbench/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /workbench/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
