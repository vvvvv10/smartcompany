server:
  port: 8083

spring:
  application:
    name: crm
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/crm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        # Nacos 2.x 客户端 gRPC 端口 = 主端口 + 1000，容器网络里必须能通
        # 若注册失败优先检查 9848 是否可达

# CRM 不做接口级角色限制：任何登录用户（网关已验签并注入身份头）都可读写。
# 行级归属（owner_id）只用于展示与筛选，不作为安全边界。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.crm: INFO
