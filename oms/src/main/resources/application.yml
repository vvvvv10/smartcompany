server:
  port: 8086

spring:
  application:
    name: oms
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/oms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        # Nacos 2.x 客户端 gRPC 端口 = 主端口 + 1000，容器网络里必须能通
        # 若注册失败优先检查 9848 是否可达

# 三系统关联（39 号方案）：OMS 发货时直连 TMS/WMS 建档、列表聚合运单/出库列。
# 默认走 compose 网络服务名，容器外开发用环境变量覆盖（如 http://localhost:8084）。
tms:
  base-url: ${TMS_BASE_URL:http://tms:8084}
wms:
  base-url: ${WMS_BASE_URL:http://wms:8085}

# OMS 不做接口级角色限制：任何登录用户（网关已验签并注入身份头）都可读写。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.oms: INFO
